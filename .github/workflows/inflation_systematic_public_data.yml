name: Systematic inflation public data

on:
  push:
    branches:
      - inflation-systematic-research
    paths:
      - "research/inflation_systematic/download_public_modalities.py"
      - ".github/workflows/inflation_systematic_public_data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: inflation-systematic-research

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "requests>=2.32" \
            "beautifulsoup4>=4.12" "lxml>=5.0" "openpyxl>=3.1" \
            "xlrd>=2.0" "pyarrow>=16"

      - name: Download public modalities
        run: python research/inflation_systematic/download_public_modalities.py

      - name: Summarize collection
        run: |
          du -ah research/inflation_systematic/data | sort -h | tail -n 50
          cat research/inflation_systematic/data/download_manifest.json | head -n 80

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: inflation-systematic-public-data
          path: research/inflation_systematic/data/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
