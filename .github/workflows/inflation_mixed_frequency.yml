name: Inflation mixed-frequency nowcast

on:
  push:
    branches:
      - inflation-systematic-research
    paths:
      - "research/inflation_systematic/build_mixed_frequency_nowcast.py"
      - ".github/workflows/inflation_mixed_frequency.yml"
  pull_request:
    branches:
      - master
    paths:
      - "research/inflation_systematic/build_mixed_frequency_nowcast.py"
      - ".github/workflows/inflation_mixed_frequency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mixed-frequency:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: inflation-systematic-research

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.1" "requests>=2.31" \
            "openpyxl>=3.1" "xlrd>=2.0"

      - name: Build exact-deadline nowcasts
        run: python research/inflation_systematic/build_mixed_frequency_nowcast.py

      - name: Inspect outputs
        run: |
          ls -lh inflation_systematic_mixed_frequency.zip
          cat research/inflation_systematic/mixed_frequency/manifest.json
          head -n 5 research/inflation_systematic/mixed_frequency/processed/mixed_frequency_nowcasts.csv

      - name: Upload source-preserving artifact
        uses: actions/upload-artifact@v4
        with:
          name: inflation-systematic-mixed-frequency
          path: inflation_systematic_mixed_frequency.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
