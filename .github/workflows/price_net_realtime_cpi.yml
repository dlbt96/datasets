name: PRICE-NET real-time CPI data

on:
  push:
    branches:
      - price-net-transcripts
    paths:
      - "research/price_net/download_philadelphia_realtime.py"
      - ".github/workflows/price_net_realtime_cpi.yml"
  pull_request:
    branches:
      - master
    paths:
      - "research/price_net/download_philadelphia_realtime.py"
      - ".github/workflows/price_net_realtime_cpi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-realtime-cpi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: price-net-transcripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.1" "openpyxl>=3.1" "requests>=2.31"

      - name: Download and export workbooks
        run: python research/price_net/download_philadelphia_realtime.py

      - name: Upload processed real-time targets
        uses: actions/upload-artifact@v4
        with:
          name: price-net-realtime-cpi
          path: |
            research/price_net/realtime_cpi/manifest.json
            research/price_net/realtime_cpi/processed/quarterly_inflation_targets.csv
          if-no-files-found: error
          retention-days: 30

      - name: Commit source-preserving exports
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/price_net/realtime_cpi/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Add official real-time CPI source exports"
            git push origin HEAD:price-net-transcripts
          fi
