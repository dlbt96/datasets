name: PRICE-NET transcript features

on:
  push:
    branches:
      - price-net-transcripts
    paths:
      - "research/price_net/build_transcript_features.py"
      - ".github/workflows/price_net_transcript_features.yml"
  pull_request:
    branches:
      - master
    paths:
      - "research/price_net/build_transcript_features.py"
      - ".github/workflows/price_net_transcript_features.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-features:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: price-net-transcripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets>=3.0,<5" "huggingface_hub>=0.30" \
            "pandas>=2.1" "pyarrow>=15" "numpy>=1.26" "scikit-learn>=1.4"

      - name: Stream corpus and build point-in-time features
        run: |
          python research/price_net/build_transcript_features.py \
            --output-dir research/price_net/output \
            --hash-features 256

      - name: Show outputs
        run: |
          ls -lh research/price_net/output
          cat research/price_net/output/earnings_call_feature_metadata.json

      - name: Upload derived features
        uses: actions/upload-artifact@v4
        with:
          name: price-net-transcript-features
          path: research/price_net/output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Commit derived features to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/price_net/output/
          if git diff --cached --quiet; then
            echo "No feature changes to commit."
          else
            git commit -m "Add derived PRICE-NET transcript features"
            git push origin HEAD:price-net-transcripts
          fi
